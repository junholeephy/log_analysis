# 설정 예시 — 모든 키가 여기 등장한다.
#
# 운영 실값은 AA/configs/local.yaml 에 두고 --config 로 가리킨다. 이 파일은
# 커밋되고 그 파일은 커밋되지 않는다.
#
# 운영 환경에서는 코드를 한 줄도 못 고친다. 그래서 바뀔 만한 값은 전부 여기 있어야
# 한다. **"코드 한 줄만 고치면 되는데" 하는 순간이 오면 그 값이 여기 없었다는
# 뜻이다.** 고치지 말고 docs/insights/ 에 적어서 가지고 나올 것.
#
# 생략한 키는 src/ragdiag/settings.py 의 기본값을 쓴다. 그 기본값은 여기 적힌
# 것과 같다 - 다르면 config.py 의 테스트가 깨진다.

# ---------------------------------------------------------------------------
# 입출력 경로
# ---------------------------------------------------------------------------
paths:
  conv_data: data/conv_eval.json      # 분석할 로그
  filter_data: null                   # 필터 JSON. null 이면 진단 가능한 후속 턴 전부
  turns: null                         # 운영 필터가 고른 턴 목록. 주면 filter_data 를
                                      # 쓰지 않는다 (둘 다 주면 거절한다).
                                      # 형식은 filter.md 참고
  output_dir: output                  # 산출물 디렉터리. 없으면 만든다
                                      # 파일명에 끝난 시각이 붙는다
                                      #   conv_parsed_20260831-150422.json
                                      #   run_summary_20260831-150422.txt
  out: null                           # 결과 파일 경로를 직접 지정.
                                      # 주면 output_dir 와 시각 스탬프를 무시한다
  cache: .cache                       # LLM 판정 캐시. null 이면 캐시 안 씀
  dept_class: null                    # 부서 분류 체계 JSON (대시보드용)
  job_class: null                     # 직급 분류 체계 JSON (대시보드용)

# ---------------------------------------------------------------------------
# 라벨 실값
#
# llm_eval_result / llm_emotion_result 의 라벨 이름과 점수는 **운영 코드값이라
# 저장소에 두지 않는다** (규격 §1.1 · C3). 저장소에는 자리표시자만 있다.
#
# 운영 taxonomy 문서를 그대로 가리키면 된다. 형식은 한 줄에 `A. 이름 -> 점수`이고
# `# 그룹명` 줄로 묶을 수 있다 — 운영 환경에 이미 있는 문서 형식 그대로다.
#
# 비워 두면 자리표시자로 돈다. 그 상태로 라벨·점수 조건을 건 필터를 주면
# 계산을 시작하기 전에 죽는다. 조용히 0건이 나오는 것보다 낫기 때문이다.
# ---------------------------------------------------------------------------
labels:
  query: null               # 예: configs/query_taxonomy.md
  emotion: null             # 예: configs/emotion_taxonomy.md

# ---------------------------------------------------------------------------
# LLM 접속
#
# url·key 를 비워 두면 환경변수에서 찾는다 (LLM_API_URL / LLM_API_KEY).
# 운영 환경 .bashrc 에 이미 있으면 여기 적을 필요가 없다.
# ---------------------------------------------------------------------------
llm:
  backend: local            # local(OpenAI 호환 HTTP) | cli(claude -p) | api
  url: null
  key: null
  model: null               # null 이면 서버의 /v1/models 에서 자동 탐지
  json_mode: auto           # auto | json_schema | guided_json | json_object | none
  thinking: auto            # auto | on | off
  max_tokens: 16000
  timeout_sec: 600

# ---------------------------------------------------------------------------
# 실행
# ---------------------------------------------------------------------------
run:
  workers: 4                # 동시 실행 턴 수
  limit: null               # 앞에서 N건만. 비용 확인용
  history_turns: 3          # Step 1 에 넘길 이전 질문 개수 상한. 0 이면 제한 없음

# ---------------------------------------------------------------------------
# 판정 임계값
#
# 여기 값을 바꾸면 골든셋·회귀셋을 다시 돌릴 것. 임계값 하나가 판정 전체를
# 움직인다. 특히 match_threshold 를 낮추면 지어낸 인용이 통과하기 시작한다.
# ---------------------------------------------------------------------------
thresholds:
  match_threshold: 0.9          # 인용 대조 통과 최소 연속 일치 비율
  evidence_min_quote_chars: 8   # 판정자가 낸 근거 인용의 최소 길이
  answer_quote_min_chars: 10    # 답변이 제시한 인용문의 최소 길이 (case24)
  vague_short_max_chars: 400    # "짧게 답해줘" 판정 기준 (case11)

# ---------------------------------------------------------------------------
# 서비스 자원 부족 응답 (case9)
#
# 모델 자원을 확보하지 못했을 때 서비스가 답변 자리에 넣는 확정 문구.
# **배포마다 다르므로 운영 실값은 local.yaml 에 적는다.**
# 부분 일치라 뒤에 안내가 더 붙어도 잡힌다 - 앞부분만 정확하면 된다.
# ---------------------------------------------------------------------------
service_error:
  templates:
    - "서비스에 문제가 있거나, 사용자 분들이 많아서 서버에 부하가 걸리고 있어요"
  # 확정 문구가 조금 바뀌어도 놓치지 않게 두는 보조 표지.
  # 단독으로는 안 쓰고 두 개 이상 겹칠 때만 인정한다.
  markers:
    - "서버에 부하"
    - "사용자 분들이 많아"
    - "일시적인 오류"
    - "잠시 후 다시"
    - "요청이 많아"
    - "응답을 생성하지 못"
    - "서비스에 문제가"
  # 표지 기반 대체 경로에만 걸리는 상한. 확정 문구가 맞으면 길이는 안 본다.
  max_chars: 400

# ---------------------------------------------------------------------------
# 조직 분류
# ---------------------------------------------------------------------------
org:
  # 조직 분류 체계가 붙을 수 있는 로그 필드. 값을 대조해 고른다.
  candidate_fields:
    - db_dept_name
    - db_job_name
    - job_grade
    - db_position_name

# ---------------------------------------------------------------------------
# 필터
# ---------------------------------------------------------------------------
filter:
  # 필터 값에서 "제한 없음"을 뜻하는 문자열들.
  any_values: ["전체", "all", "ALL", "", "*"]
